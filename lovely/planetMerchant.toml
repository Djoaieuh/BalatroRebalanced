[manifest]
version = "1.0.0"
priority = 0

# ============================================================
# Planet Merchant + Planet Tycoon
# ============================================================

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''if self.ability.consumeable.hand_type then
            level_up_hand(used_tarot, self.ability.consumeable.hand_type)
        end'''
position = "at"
payload = '''if self.ability.consumeable.hand_type then
            level_up_hand(used_tarot, self.ability.consumeable.hand_type)

            -- Planet Merchant
            if self.config.center.set == 'Planet'
                and G.GAME.used_vouchers
                and G.GAME.used_vouchers.v_planet_merchant
            then
                level_up_hand(used_tarot, self.ability.consumeable.hand_type)
            end

            -- Planet Tycoon
            if self.config.center.set == 'Planet'
                and G.GAME.used_vouchers
                and G.GAME.used_vouchers.v_planet_tycoon
                and G.GAME.planet_tycoon_active
            then
                G.GAME.planet_tycoon_discount =
                    (G.GAME.planet_tycoon_discount or 0) + 1

                calculate_reroll_cost(true)
            end
        end'''
match_indent = true

