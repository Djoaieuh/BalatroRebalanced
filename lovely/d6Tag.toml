[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# D6 Tag: first 3 rerolls of the next shop are free, then the cost increments normally.
# The next line in the vanilla code (calculate_reroll_cost(true)) recalculates the cost,
# and vanilla already sets it to $0 while free_rerolls > 0.
[[patches]]
[patches.pattern]
target = "tag.lua"
pattern = "G.GAME.round_resets.temp_reroll_cost = 0"
position = "at"
payload = "G.GAME.current_round.free_rerolls = (G.GAME.current_round.free_rerolls or 0) + 3"
match_indent = true