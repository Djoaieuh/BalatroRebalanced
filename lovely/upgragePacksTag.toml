[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# Charm Tag
[[patches]]
[patches.pattern]
target = "tag.lua"
pattern = "local key = 'p_arcana_mega_'..(math.random(1,2))"
position = "before"
payload = "apply_pack_upgrade('Charm Tag')"
match_indent = true

# Meteor Tag
[[patches]]
[patches.pattern]
target = "tag.lua"
pattern = "local key = 'p_celestial_mega_'..(math.random(1,2))"
position = "before"
payload = "apply_pack_upgrade('Meteor Tag')"
match_indent = true

# Standard Tag
[[patches]]
[patches.pattern]
target = "tag.lua"
pattern = "local key = 'p_standard_mega_1'"
position = "before"
payload = "apply_pack_upgrade('Standard Tag')"
match_indent = true

# Buffoon Tag
[[patches]]
[patches.pattern]
target = "tag.lua"
pattern = "local key = 'p_buffoon_mega_1'"
position = "before"
payload = "apply_pack_upgrade('Buffoon Tag')"
match_indent = true