[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "add_round_eval_row({name = 'bottom', dollars = dollars})"
position = "before"
payload = '''
local economy_base = dollars
if economy_base > 0 then
    for i = 1, #G.GAME.tags do
        local tag = G.GAME.tags[i]
        if tag.name == 'Economy Tag' and not tag.triggered then
            local ret = economy_tag_trigger(tag, economy_base)
            add_round_eval_row({dollars = ret.dollars, bonus = true, name = 'tag'..i, pitch = pitch, condition = ret.condition, pos = ret.pos, tag = ret.tag})
            pitch = pitch + 0.06
            dollars = dollars + ret.dollars
        end
    end
end
'''
match_indent = true